# Traefik dynamic configuration for the LOCAL Docker Compose stack only.
#   /api/*  → API (prefix stripped; the API serves /v1/..., /health, /swagger)
#   /*      → frontend (nginx handles caching headers and SPA fallback)
http:
  routers:
    api-router:
      rule: "PathPrefix(`/api`)"
      service: api-service
      middlewares:
        - strip-api-prefix
        - compress
      entryPoints:
        - web

    frontend-router:
      rule: "PathPrefix(`/`)"
      service: frontend-service
      entryPoints:
        - web

  middlewares:
    compress:
      compress: {}

    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

  services:
    api-service:
      loadBalancer:
        servers:
          - url: "http://api-htf:3000"
        passHostHeader: true

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://vue-htf:8080"
        passHostHeader: true
