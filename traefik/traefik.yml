# Traefik static configuration for the LOCAL Docker Compose stack only.
# Kubernetes uses the K3s-managed Traefik and the Ingress in deploy/k8s.
#
# The experimental JWT plugins that used to be declared here (agilezebra/jwt-middleware and
# antoniomika/dynamic-jwt-validation) were never attached to any router in dynamic.yml, so
# they protected nothing; they were removed. See docs/kubernetes-migration.md (Security).

entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: 30s
        # Must exceed the OpenAI timeout (20 s) plus artificial latency for captain chat.
        writeTimeout: 60s
        idleTimeout: 60s

  metrics:
    address: ":8082"

ping:
  entryPoint: web

log:
  level: INFO
  format: json

accessLog: {}

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.0
      - 5.0

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
