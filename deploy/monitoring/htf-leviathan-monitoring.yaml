# HTF Leviathan scrape targets and alerts. Requires the kube-prometheus-stack CRDs.
#   kubectl apply -f deploy/monitoring/htf-leviathan-monitoring.yaml
---
# API metrics: http_requests_total, http_request_duration_seconds, htf_chat_requests_total, process_*.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: htf-leviathan-api
  namespace: htf-leviathan
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: htf-leviathan
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# K3s Traefik metrics (requests, latency and status codes per router/service, incl. the frontend).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: htf-leviathan
  namespace: htf-leviathan
spec:
  groups:
    - name: htf-leviathan.availability
      rules:
        - alert: HTFApiUnavailable
          expr: kube_deployment_status_replicas_available{namespace="htf-leviathan",deployment="api"} < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: HTF Leviathan API has no available replicas
        - alert: HTFFrontendUnavailable
          expr: kube_deployment_status_replicas_available{namespace="htf-leviathan",deployment="frontend"} < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: HTF Leviathan frontend has no available replicas
        - alert: HTFMariaDBNotReady
          expr: kube_statefulset_status_replicas_ready{namespace="htf-leviathan",statefulset="mariadb"} < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: MariaDB is not ready (readiness uses healthcheck.sh --connect --innodb_initialized)
        - alert: HTFApiScrapeFailing
          expr: up{namespace="htf-leviathan",job=~".*api.*"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Prometheus cannot scrape the API /metrics endpoint
        - alert: HTFPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="htf-leviathan"}[30m]) > 3
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} restarted more than 3 times in 30 minutes"
    - name: htf-leviathan.api
      rules:
        - alert: HTFApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="htf-leviathan",status=~"5..",route!="/v1/voyages/:id/chat"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="htf-leviathan"}[5m])), 0.001) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of API requests (excluding chat) fail with 5xx
        - alert: HTFApiHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="htf-leviathan",route!="/v1/voyages/:id/chat"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: API p95 latency above 1 s (excluding chat)
        - alert: HTFChatErrors
          expr: increase(htf_chat_requests_total{namespace="htf-leviathan",outcome="error"}[15m]) > 5
          labels: { severity: warning }
          annotations:
            summary: Captain chat calls to OpenAI are failing (key, quota or outage)
        - alert: HTFChatDailyLimitReached
          expr: increase(htf_chat_requests_total{namespace="htf-leviathan",outcome="rate_limited_daily"}[1h]) > 0
          labels: { severity: info }
          annotations:
            summary: The daily captain chat cap (CHAT_DAILY_LIMIT) was reached
    - name: htf-leviathan.backup
      rules:
        - alert: HTFBackupFailed
          expr: kube_job_status_failed{namespace="htf-leviathan",job_name=~"mariadb-backup.*"} > 0
          labels: { severity: warning }
          annotations:
            summary: "MariaDB backup job {{ $labels.job_name }} failed"
        - alert: HTFBackupMissing
          expr: time() - max(kube_cronjob_status_last_successful_time{namespace="htf-leviathan",cronjob="mariadb-backup"}) > 26 * 3600
          labels: { severity: warning }
          annotations:
            summary: No successful MariaDB backup in the last 26 hours
