# Grafana dashboard, auto-loaded by the Grafana sidecar (label grafana_dashboard: "1").
#   kubectl apply -f deploy/monitoring/htf-leviathan-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: htf-leviathan-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  htf-leviathan.json: |
    {
      "title": "HTF Leviathan",
      "uid": "htf-leviathan",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        { "type": "stat", "title": "Available replicas", "gridPos": { "x": 0, "y": 0, "w": 8, "h": 4 },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{namespace=\"htf-leviathan\"}", "legendFormat": "{{deployment}}" },
            { "expr": "kube_statefulset_status_replicas_ready{namespace=\"htf-leviathan\"}", "legendFormat": "{{statefulset}}" } ] },
        { "type": "stat", "title": "Container restarts (24h)", "gridPos": { "x": 8, "y": 0, "w": 8, "h": 4 },
          "targets": [ { "expr": "sum by (container) (increase(kube_pod_container_status_restarts_total{namespace=\"htf-leviathan\"}[24h]))", "legendFormat": "{{container}}" } ] },
        { "type": "stat", "title": "Captain chats today (ok)", "gridPos": { "x": 16, "y": 0, "w": 8, "h": 4 },
          "targets": [ { "expr": "sum(increase(htf_chat_requests_total{namespace=\"htf-leviathan\",outcome=\"ok\"}[24h]))" } ] },
        { "type": "timeseries", "title": "API requests/s by route", "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (route) (rate(http_requests_total{namespace=\"htf-leviathan\"}[5m]))", "legendFormat": "{{route}}" } ] },
        { "type": "timeseries", "title": "API responses/s by status", "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (status) (rate(http_requests_total{namespace=\"htf-leviathan\"}[5m]))", "legendFormat": "{{status}}" } ] },
        { "type": "timeseries", "title": "API p95 latency by route (s)", "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket{namespace=\"htf-leviathan\"}[5m])))", "legendFormat": "{{route}}" } ] },
        { "type": "timeseries", "title": "Captain chat outcomes/min", "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (outcome) (rate(htf_chat_requests_total{namespace=\"htf-leviathan\"}[5m])) * 60", "legendFormat": "{{outcome}}" } ] },
        { "type": "timeseries", "title": "Traefik requests/s by service and code", "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (service, code) (rate(traefik_service_requests_total{service=~\"htf-leviathan.*\"}[5m]))", "legendFormat": "{{service}} {{code}}" } ] },
        { "type": "timeseries", "title": "Memory working set by container", "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [ { "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"htf-leviathan\",container!=\"\"})", "legendFormat": "{{container}}" } ] },
        { "type": "timeseries", "title": "CPU by container (cores)", "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"htf-leviathan\",container!=\"\"}[5m]))", "legendFormat": "{{container}}" } ] },
        { "type": "timeseries", "title": "Node: CPU, memory and root disk used (%)", "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100 } },
          "targets": [
            { "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "legendFormat": "cpu" },
            { "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "memory" },
            { "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"})", "legendFormat": "disk /" } ] }
      ]
    }
