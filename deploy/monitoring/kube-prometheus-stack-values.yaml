# Lightweight kube-prometheus-stack for a single-node K3s (CX33: 4 vCPU, 8 GB RAM).
# Install (namespace "monitoring"), see docs/monitoring.md:
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --version <pinned> -f deploy/monitoring/kube-prometheus-stack-values.yaml
#
# Nothing here is exposed publicly: all Services are ClusterIP; use kubectl port-forward.
# Expected footprint: ~0.9-1.3 GiB RAM total, mostly Prometheus.

fullnameOverride: kps

# No receivers configured yet → no Alertmanager. Alerts remain visible in Prometheus/Grafana.
# To enable notifications later, set alertmanager.enabled=true and configure a receiver.
alertmanager:
  enabled: false

# K3s runs the scheduler, controller-manager, proxy and (sqlite/kine) datastore inside the
# k3s binary; there are no separate pods to scrape. Disabling avoids permanent "target down".
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 6GB
    # Pick up ServiceMonitors / PodMonitors / rules from every namespace, not only Helm-labelled ones.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  enabled: true
  # Admin credentials come from a Secret you create (never committed), see docs/monitoring.md.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  ingress:
    enabled: false
  defaultDashboardsTimezone: utc
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 96Mi
    dashboards:
      enabled: true
      searchNamespace: ALL
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    users:
      allow_sign_up: false
