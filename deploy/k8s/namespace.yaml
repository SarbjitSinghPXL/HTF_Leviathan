# Applied ONCE, separately from the kustomization, on purpose:
# deleting a namespace deletes its PersistentVolumeClaims (and with K3s local-path, the data).
# Keeping it out of `kubectl apply -k` means `kubectl delete -k` can never remove it.
#   kubectl apply -f deploy/k8s/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: htf-leviathan
  labels:
    app.kubernetes.io/part-of: htf-leviathan
    # Enforce the "restricted" Pod Security Standard for everything in this namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
