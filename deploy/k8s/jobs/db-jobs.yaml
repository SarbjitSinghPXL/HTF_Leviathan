# Explicit, manually triggered database jobs. NOT part of the normal deployment.
#   kubectl apply -k deploy/k8s/overlays/production/jobs      (creates both Jobs)
# Both are idempotent and never drop data (see api/app/src/db/migrate.ts and seed.ts).
# Re-running: delete the finished Job first (kubectl -n htf-leviathan delete job htf-db-migrate).
apiVersion: batch/v1
kind: Job
metadata:
  name: htf-db-migrate
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: db-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: htf-leviathan
        app.kubernetes.io/component: db-migrate
        htf-leviathan/db-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: htf-leviathan-api
          command: ["bun", "src/db/migrate.ts"]
          env:
            - name: DB_HOST
              value: mariadb
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: htf-db, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: htf-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: htf-db, key: password } }
            # Only for a database restored from the old Docker Compose setup (see docs).
            - name: MIGRATE_BASELINE_EXISTING
              value: "false"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# The seed job retries until the migrate job has created the tables (seed fails fast if not).
apiVersion: batch/v1
kind: Job
metadata:
  name: htf-db-seed
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: db-seed
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: htf-leviathan
        app.kubernetes.io/component: db-seed
        htf-leviathan/db-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: htf-leviathan-api
          command: ["bun", "src/db/seed.ts"]
          env:
            - name: DB_HOST
              value: mariadb
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: htf-db, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: htf-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: htf-db, key: password } }
            # Only for a database restored from the old Docker Compose setup (see docs).
            - name: SEED_ADOPT_EXISTING
              value: "false"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
