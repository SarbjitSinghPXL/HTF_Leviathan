# Nightly logical backup (mariadb-dump) to a separate PVC, keeping 14 days.
# This PVC lives on the SAME node disk as the database: it protects against mistakes
# (bad migration, accidental delete), NOT against losing the server. Copy dumps off
# the node regularly — see docs/database-backup-restore.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-backups
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: db-backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: db-backup
spec:
  schedule: "30 2 * * *" # 02:30 every day (cluster time zone)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: htf-leviathan
            app.kubernetes.io/component: db-backup
            htf-leviathan/db-client: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: mariadb:11.8.9
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail  # pipefail: a failed dump must fail the job, not write an empty file
                  # Wait for connectivity (NetworkPolicy rules for a new pod take a few seconds).
                  for i in $(seq 1 30); do
                    mariadb-admin --host=mariadb --user="$DB_USER" ping >/dev/null 2>&1 && break
                    [ "$i" = 30 ] && { echo "Database unreachable"; exit 1; }
                    sleep 2
                  done
                  file="/backups/htf-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  mariadb-dump --host=mariadb --user="$DB_USER" \
                    --single-transaction --quick --routines --triggers --events \
                    --databases "$DB_NAME" | gzip -9 > "$file.partial"
                  # mariadb-dump writes this trailer only when the dump finished completely.
                  gunzip -c "$file.partial" | tail -n 1 | grep -q "Dump completed" \
                    || { echo "Dump incomplete"; rm -f "$file.partial"; exit 1; }
                  mv "$file.partial" "$file"
                  echo "Backup written: $file ($(du -h "$file" | cut -f1))"
                  find /backups -name 'htf-*.sql.gz' -mtime +14 -print -delete
              env:
                - name: DB_NAME
                  valueFrom: { secretKeyRef: { name: htf-db, key: database } }
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: htf-db, key: username } }
                - name: MYSQL_PWD # read by mariadb-dump; keeps the password off the command line
                  valueFrom: { secretKeyRef: { name: htf-db, key: password } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mariadb-backups
            - name: tmp
              emptyDir: {}
