# Production overlay for the Hetzner K3s cluster.
#   kubectl kustomize deploy/k8s/overlays/production     # render / review
#   kubectl apply -k deploy/k8s/overlays/production      # deploy
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: htf-leviathan

resources:
  - ../../base
  - site-config.yaml

components:
  - images
  - ../../components/backup

replacements:
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.hostname
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.clusterIssuer
    targets:
      - select:
          kind: Ingress
          name: htf-leviathan-web
        fieldPaths:
          - metadata.annotations.[cert-manager.io/cluster-issuer]
