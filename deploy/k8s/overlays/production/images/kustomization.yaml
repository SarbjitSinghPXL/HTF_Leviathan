# Single source of truth for image versions, shared by the app and the DB jobs.
# Use immutable tags (sha-<commit> or vX.Y.Z), or better, digests:
#   cd deploy/k8s/overlays/production/images
#   kustomize edit set image htf-leviathan-api=ghcr.io/teopxl/htf-leviathan-api:sha-abc1234
# (or edit newTag / add `digest: sha256:...` by hand)
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: htf-leviathan-api
    newName: ghcr.io/teopxl/htf-leviathan-api
    newTag: set-release-tag
  - name: htf-leviathan-frontend
    newName: ghcr.io/teopxl/htf-leviathan-frontend
    newTag: set-release-tag
