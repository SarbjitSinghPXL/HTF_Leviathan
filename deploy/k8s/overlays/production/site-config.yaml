# ── EDIT THIS FILE before deploying ─────────────────────────────────────
# Local-only settings consumed by kustomize `replacements`; never applied to the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-config
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  # Public hostname. The placeholder uses the reserved .invalid TLD, so certificate
  # issuance cannot succeed by accident before a real hostname is chosen.
  hostname: htf-leviathan.change-me.invalid
  # Start with letsencrypt-staging; switch to letsencrypt-production once DNS resolves to
  # 178.105.83.76 and a staging certificate was issued successfully (docs/deployment.md).
  clusterIssuer: letsencrypt-staging
