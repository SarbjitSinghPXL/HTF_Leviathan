# Bun/Elysia API. Never migrates or seeds on startup (see ../jobs for explicit DB jobs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_POOL_SIZE: "10"
  # Wait up to ~150 s for MariaDB (first-time initialisation takes ~1 min) instead of restarting.
  DB_CONNECT_ATTEMPTS: "50"
  DB_CONNECT_RETRY_MS: "3000"
  # Swagger is disabled publicly. To use it: set "true", roll out, then
  # `kubectl -n htf-leviathan port-forward svc/api 3000:3000` → http://localhost:3000/swagger
  # (/api/swagger is additionally blocked at the Ingress).
  SWAGGER_ENABLED: "false"
  METRICS_ENABLED: "true"
  TRUST_PROXY_HEADERS: "true"
  MAX_REQUEST_BODY_BYTES: "16384"
  SHUTDOWN_TIMEOUT_SECONDS: "20"
  # Captain chat cost controls (in-memory, per API pod).
  CHAT_ENABLED: "true"
  OPENAI_MODEL: gpt-4o-mini
  OPENAI_TIMEOUT_MS: "20000"
  CHAT_RATE_LIMIT_PER_IP_PER_MINUTE: "6"
  CHAT_RATE_LIMIT_GLOBAL_PER_MINUTE: "30"
  CHAT_DAILY_LIMIT: "500"
  # Artificial hackathon latency is off in production.
  CHAOS_DELAY_ENABLED: "false"
  CHAOS_ERRORS_ENABLED: "false"
  TZ: GMT
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: api
spec:
  # Single replica: chat rate limits are kept in process memory.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: htf-leviathan
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: htf-leviathan
        app.kubernetes.io/component: api
        htf-leviathan/db-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "bun" user in the oven/bun image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: htf-leviathan-api # replaced by the overlay's `images:` (immutable tag/digest)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: htf-db, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: htf-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: htf-db, key: password } }
            # Optional: without it the API runs and chat returns 503 "disabled".
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: htf-api, key: openai-api-key, optional: true } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90 # 180 s: the API waits up to ~150 s for MariaDB before listening
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give Traefik time to drop the endpoint before SIGTERM stops the server.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
