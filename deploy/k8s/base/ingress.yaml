# Public routing through the existing K3s Traefik (v3, IngressClass "traefik").
#   https://HOST/        → frontend
#   https://HOST/api/*   → api, with /api stripped (the API serves /v1/..., /health, ...)
#   https://HOST/api/swagger*, /api/metrics → 403 (internal only; use kubectl port-forward)
# HOST and the cert-manager ClusterIssuer are set by the overlay (overlays/production/site-config.yaml).
# Traefik middleware references use the form <namespace>-<name>@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    # No includeSubDomains/preload: other services may live on the same parent domain.
    stsSeconds: 31536000
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress: {}
---
# Coarse edge limit for the whole API (the chat endpoint has stricter limits in the app).
# Note: without externalTrafficPolicy=Local on the Traefik Service, all clients may appear
# to come from one node IP; the values are generous for that reason (see docs/deployment.md).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-ratelimit
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 65536
---
# Allows only 127.0.0.1, i.e. nobody through the public Ingress → 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: htf-leviathan-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      htf-leviathan-redirect-https@kubernetescrd,
      htf-leviathan-security-headers@kubernetescrd
    # Only this Ingress requests the certificate; the others reuse the same TLS secret.
    cert-manager.io/cluster-issuer: letsencrypt-staging # overlay replaces this
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - HOSTNAME_PLACEHOLDER
      secretName: htf-leviathan-tls
  rules:
    - host: HOSTNAME_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: htf-leviathan-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      htf-leviathan-redirect-https@kubernetescrd,
      htf-leviathan-api-ratelimit@kubernetescrd,
      htf-leviathan-api-body-limit@kubernetescrd,
      htf-leviathan-strip-api-prefix@kubernetescrd,
      htf-leviathan-security-headers@kubernetescrd,
      htf-leviathan-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - HOSTNAME_PLACEHOLDER
      secretName: htf-leviathan-tls
  rules:
    - host: HOSTNAME_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
# Longer path prefixes win in Traefik, so these override /api for internal-only endpoints.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: htf-leviathan-internal-deny
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: htf-leviathan-deny-public@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - HOSTNAME_PLACEHOLDER
      secretName: htf-leviathan-tls
  rules:
    - host: HOSTNAME_PLACEHOLDER
      http:
        paths:
          - path: /api/swagger
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /api/metrics
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
