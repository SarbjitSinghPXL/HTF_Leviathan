# MariaDB: one replica, one persistent volume (K3s local-path), never shared between pods.
# Credentials come from the `htf-db` Secret, created manually (docs/deployment.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
data:
  htf.cnf: |
    [mariadb]
    # Sized for a shared 8 GB node; the dataset is small.
    innodb_buffer_pool_size = 256M
    max_connections = 50
    skip-name-resolve
---
# Stable ClusterIP used by the API and jobs: mariadb.htf-leviathan.svc.cluster.local:3306
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
# Headless governing Service required by the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: mariadb-headless
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: htf-leviathan
    app.kubernetes.io/component: database
spec:
  serviceName: mariadb-headless
  # Exactly one writer for the data directory. Do not scale this up.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Keep the PVC (and data) if the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: htf-leviathan
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: htf-leviathan
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # mysql user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:11.8.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: htf-db, key: root-password } }
            - name: MARIADB_DATABASE
              valueFrom: { secretKeyRef: { name: htf-db, key: database } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: htf-db, key: username } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: htf-db, key: password } }
            # Run mariadb-upgrade automatically after a MariaDB version bump.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: TZ
              value: GMT
          # Real database checks (official image helper; uses the healthcheck user it creates on init).
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60 # up to 5 minutes for first init / crash recovery
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/htf.cnf
              subPath: htf.cnf
              readOnly: true
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mariadb-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: htf-leviathan
          app.kubernetes.io/component: database
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
