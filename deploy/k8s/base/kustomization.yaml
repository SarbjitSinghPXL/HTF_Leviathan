apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace itself is NOT a resource here (see ../namespace.yaml).
namespace: htf-leviathan

labels:
  - pairs:
      app.kubernetes.io/part-of: htf-leviathan
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - mariadb.yaml
  - api.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicies.yaml
