# Builds and publishes versioned images to GitHub Container Registry (GHCR).
# It does NOT deploy: production rollout stays a manual step (docs/deployment.md).
#
# Tags produced (immutable — never `latest`):
#   push to main      → sha-<7 char commit>
#   tag v1.2.3        → v1.2.3 and sha-<commit>
# Authentication uses the workflow's GITHUB_TOKEN; no personal tokens or passwords.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case image name (GHCR requires it)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/htf-leviathan-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
          labels: |
            org.opencontainers.image.title=htf-leviathan-${{ matrix.component }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Summary
        run: |
          {
            echo "### htf-leviathan-${{ matrix.component }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Pin in deploy/k8s/overlays/production/images/kustomization.yaml (newTag or digest)."
          } >> "$GITHUB_STEP_SUMMARY"
