# Checks on every pull request and push to main. Publishes nothing, deploys nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Bundle check (server, migrate, seed)
        run: bun run build:check
      - name: Schema and migrations are in sync
        run: |
          bunx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'bun run db:generate' and commit it."
            git status --porcelain drizzle
            exit 1
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx vitest run --passWithNoTests
      - name: Lint (reported, not blocking — pre-existing findings in app code)
        run: bunx eslint .
        continue-on-error: true

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize overlays
        run: |
          mkdir -p rendered
          kubectl kustomize deploy/k8s/overlays/production > rendered/production.yaml
          kubectl kustomize deploy/k8s/overlays/production/jobs > rendered/jobs.yaml
          cp deploy/k8s/namespace.yaml rendered/namespace.yaml
      - name: Validate against Kubernetes schemas (CRDs from the community catalog)
        run: |
          docker run --rm -v "$PWD/rendered:/rendered:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /rendered

  images:
    name: Docker build (no push)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
